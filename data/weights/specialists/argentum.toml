# Argentum Combine Specialist Weights
# "The Wall" - Defense-focused with Guard, Piercing, Shield
# Emphasizes survival and board control over aggression

name = "agent_argentum"
version = 1

[default.greedy]
# Life - Argentum values survival highly
own_life = 1.5
enemy_life_damage = 1.0

# Creatures - High health creatures are preferred
own_creature_attack = 0.8
own_creature_health = 1.5
enemy_creature_attack = -0.8
enemy_creature_health = -0.6

# Board Control - Strong board presence is key
creature_count = 2.5
board_advantage = 1.5

# Resources - Efficient card usage
cards_in_hand = 0.3
action_points = 0.1

# Keywords - Argentum specialty
keyword_guard = 4.0      # PRIMARY: Wall builders
keyword_piercing = 2.5   # PRIMARY: Bypass shields
keyword_shield = 3.0     # PRIMARY: Extra protection
keyword_lethal = 1.0
keyword_lifesteal = 1.5
keyword_rush = 0.5       # Not their style
keyword_ranged = 1.5
keyword_quick = 1.0

# New Keywords
keyword_ephemeral = -2.0
keyword_regenerate = 2.5 # Synergizes with high health
keyword_stealth = 0.5
keyword_charge = 0.5

# Terminal
win_bonus = 1000.0
lose_penalty = -1000.0
