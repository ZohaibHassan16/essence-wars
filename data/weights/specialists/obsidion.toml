# Obsidion Syndicate Specialist Weights
# "The Glass Cannon" - Burst damage with Lifesteal, Stealth, Ephemeral, Quick
# Emphasizes direct damage and life manipulation

name = "agent_obsidion"
version = 1

[default.greedy]
# Life - Values life highly due to Lifesteal synergy
own_life = 1.2
enemy_life_damage = 2.5  # High priority on dealing damage

# Creatures - Attack matters, health is secondary
own_creature_attack = 1.3
own_creature_health = 0.6
enemy_creature_attack = -0.8
enemy_creature_health = -0.5

# Board Control - Quality over quantity
creature_count = 1.5
board_advantage = 1.0

# Resources - Values hand for combos
cards_in_hand = 0.5
action_points = 0.15

# Keywords - Obsidion specialty
keyword_guard = 0.5      # Not their style (avoid)
keyword_piercing = 1.0
keyword_shield = 1.0
keyword_lethal = 1.5
keyword_lifesteal = 4.0  # PRIMARY: Life manipulation
keyword_rush = 2.0
keyword_ranged = 1.5
keyword_quick = 3.5      # PRIMARY: Strike first

# New Keywords
keyword_ephemeral = 0.5  # Obsidion uses Ephemeral creatures strategically
keyword_regenerate = 0.5 # Not their focus (avoid)
keyword_stealth = 4.0    # PRIMARY: Assassination tactics
keyword_charge = 2.0

# Terminal
win_bonus = 1000.0
lose_penalty = -1000.0
