    neutral: [summon_neutral_01, summon_neutral_02, summon_neutral_03]

  death:
    argentum: [death_argentum_01, death_argentum_02, death_argentum_03]
    symbiote: [death_symbiote_01, death_symbiote_02, death_symbiote_03]
