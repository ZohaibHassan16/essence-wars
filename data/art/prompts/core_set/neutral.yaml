# =============================================================================
# FREE-WALKERS ART PROMPTS
# =============================================================================
# Aesthetic: Wasteland mercenaries, frontier sellswords, practical survivors
# Style: 90s Magic the Gathering card art, painted fantasy illustration
# Theme: Professional neutrality, mixed-faction gear, desert wastelands
# IMPORTANT: Fantasy weapons only (crossbows, bows, swords) - NO modern firearms
# =============================================================================

faction: neutral
style_guide: |
  Free-Walkers are mercenaries who work for coin, not ideology. Their gear is
  salvaged from all three factions - brass from Argentum, bone from Symbiote,
  dark leather from Obsidion. They inhabit desert wastelands, frontier towns,
  and trade roads. Weathered but professional, battle-worn but competent.

cards:
  # === CREATURES (4000-4009) ===

  - id: 4000
    name: "Bounty Hunter"
    card_type: creature
    tags: [Mercenary]
    prompt: >
      A weathered female bounty hunter with a heavy crossbow, athletic build in
      worn leather armor with brass pauldrons from Argentum salvage, dusty desert
      cloak, confident calculating gaze, wanted posters tucked in her belt,
      desert mesa backdrop with distant frontier town, golden hour lighting,
      90s Magic the Gathering card art, painted fantasy illustration
    lora: "frazetta:0.5, classical-painting:0.5"
    negative: "rifle, pistol, gun, modern weapon, sci-fi, chitin, insect, blurry, low quality, text, watermark"

  - id: 4001
    name: "Berserker"
    card_type: creature
    tags: [Warrior]
