      catching the light, classical fantasy cityscape oil painting, 90s Magic the
      Gathering art style, visible brushstrokes, warm color palette
    lora: "rutkowski:0.5, classical-painting:0.5"
    negative: "digital art, concept art, photorealistic, 3D render, modern buildings, contemporary, guns, firearms, clean lines, smooth gradients, anime, text, watermark, signature, border, frame"

  # 4. Prismatic Geode Cavern - Underground Essence deposits
