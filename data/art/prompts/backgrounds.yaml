# Essence Wars - Background Art Prompts
# World-themed backgrounds for menus and game boards
# Resolution: 1344x768 (16:9, FLUX-friendly) → Upscale 2x to 2688x1536
#
# STYLE GUIDE:
# - 90s Magic the Gathering painted fantasy illustration
# - Oil painting technique, visible brushstrokes
# - Classical fantasy art (Frazetta, Vallejo, MTG artists)
# - Rich colors, dramatic lighting, painterly atmosphere
# - NO digital art, NO concept art, NO photorealistic rendering

backgrounds:
  # 1. Extraction Dispute - Battle over an Essence vein
  - id: extraction_dispute
    name: "Extraction Dispute"
    description: "Active battle over an Essence vein with forces from all factions"
    prompt: >
      An epic fantasy battle scene painted in oil, three armies clashing over a massive
      glowing crystal formation erupting from rocky earth, white-armored knights with
      brass shields on one side, wild druids with wolf companions and bone totems on
      another, dark-robed mages channeling crimson energy on the third, the prismatic
      crystal radiating blue and purple magical light at the center, ancient brass
      steam-powered war machines in the distance belching white steam, dust and magical
      energy swirling, dramatic sunset with golden orange clouds, classical fantasy
      oil painting, 90s Magic the Gathering card art style, painted with visible
      brushstrokes, rich saturated colors, epic composition, Frank Frazetta style
    lora: "frazetta:0.5, classical-painting:0.5"
    negative: "digital art, concept art, photorealistic, 3D render, modern, industrial, oil derrick, oil rig, photography, smooth gradients, airbrushed, anime, cartoon, text, watermark, signature, border, frame, letterbox"

  # 2. The Scars at Dawn - Panoramic conflict zone
  - id: the_scars_at_dawn
    name: "The Scars at Dawn"
    description: "The famous conflict zone between faction territories at sunrise"
    prompt: >
      A vast panoramic landscape painting of ancient battlefields at dawn, scarred
      earth with overgrown trenches and crumbling stone fortifications stretching to
      the horizon, broken wooden catapults and overturned brass-wheeled wagons half-buried
      in the soil, shattered siege towers of timber and iron, glowing crystal craters
      pulsing with faint blue magical residue, distant silhouettes of three different
      civilizations on the horizons - gleaming white towers to the west, massive ancient
      forest to the east, dark Gothic spires to the north, golden dawn light breaking
      through dramatic clouds casting long shadows across the wounded land, mist rising
      from the scarred valleys, classical landscape oil painting, 90s Magic the Gathering
      art style, painterly brushwork, romantic fantasy atmosphere, Hudson River School influence
    lora: "rutkowski:0.5, classical-painting:0.5"
    negative: "digital art, concept art, photorealistic, 3D render, modern, contemporary, photography, smooth, clean lines, vector art, anime, text, watermark, signature, border, frame, walker, AT-AT, bipedal machine, robot, mech, mechanical legs, science fiction"

  # 3. Last Hope City - Free-Walker settlement
  - id: last_hope_city
    name: "Last Hope City"
    description: "The ramshackle Free-Walker city built in pre-Calamity ruins"
    prompt: >
      A fantastical frontier city painted in rich oils, built within colossal ancient
      stone ruins overgrown with vines, ramshackle wooden buildings and colorful tents
      nestled among crumbling marble columns and broken statues, busy market streets
      filled with diverse merchants and towering giant humanoids, brass clockwork
