commanders:
  # === ARGENTUM COMBINE ===
  - id: 5000
    name: "The High Artificer"
    faction: argentum
    archetype: "Token/Construct generation"
    prompt: >
      Three-quarter view waist-up portrait of a brilliant female artificer commander,
      showing from head to waist with inventor's poise. Ornate white and gold robes
      with brass mechanical augmentations visible on her shoulders, arms, and torso.
      Attractive confident face with intelligent piercing eyes gazing forward, brass
      goggles with intricate gears pushed up on her forehead. Multiple delicate
      mechanical arms from her brass backpack extending over her shoulders and around
      her body - one holding a glowing blueprint hologram, another assembling a tiny
      clockwork construct in mid-air near her hand. Her natural hands are positioned
      gracefully, one gesturing toward her creation, the other holding precision tools.
      Confident, innovative stance showing mastery of her craft. Warm golden light from
      forges creating soft rim lighting on her face, hair, and robes. Refined, elegant
      expression showing wisdom and authority. Workshop with floating blueprints and
      tool drones softly blurred in background. 90s Magic the Gathering card art,
      painted fantasy illustration with classical portrait composition.
    lora: "rutkowski:0.4, classical-painting:0.7"
    negative: "organic, soft, natural, blurry, low quality, full body, legs"

