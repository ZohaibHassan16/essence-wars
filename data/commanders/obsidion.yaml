# Obsidion Syndicate Commanders
# 4 commanders defining the burst damage, shadow-focused faction
# ID range: 5008-5011

commanders:
  - id: 5008
    name: "The Blood Sovereign"
    card_type: commander
    faction: Obsidion
    rarity: Legendary
    passive_ability:
      description: "Your creatures have Lifesteal and +0/+1"
      effect:
        type: grant_keyword_and_buff
        keyword: Lifesteal
        attack: 0
        health: 1
    flavor: "Blood is such an inefficient fuel. Let me show you how to refine it."

  - id: 5009
    name: "The Deathmaster"
    card_type: commander
    faction: Obsidion
    rarity: Legendary
    passive_ability:
      description: "Your creatures with Lethal have Quick"
      effect:
        type: grant_keyword_if_keyword
        required_keyword: Lethal
        granted_keyword: Quick
    flavor: "Every blade finds its mark."

  - id: 5010
    name: "The Shadow Weaver"
    card_type: commander
    faction: Obsidion
    rarity: Legendary
    triggered_ability:
      trigger: StartOfTurn
      description: "At the start of your turn, summon a 1/1 Shade with Stealth and Soul Siphon"
      effects:
        - type: summon_token
          token:
            name: "Shade"
            attack: 1
            health: 1
            keywords: [Stealth]
            abilities:
              - name: "Soul Siphon"
                essence_cost: 1
                targeting: NoTarget
                effects:
                  - type: destroy_self
                  - type: damage
                    amount: 1
                  - type: heal_self
                    amount: 2
    flavor: "Shadows don't lie. They simply don't tell the whole truth."

  - id: 5011
    name: "Void Archon"
    card_type: commander
    faction: Obsidion
    rarity: Legendary
    passive_ability:
      description: "Your creatures have Quick"
      effect:
        type: grant_keyword
        keyword: Quick
    flavor: "Time is just another resource to exploit."
