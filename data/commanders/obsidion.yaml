# Obsidion Syndicate Commanders
# 4 commanders defining the burst damage, shadow-focused faction
# ID range: 5008-5011

commanders:
  - id: 5008
    name: "The Blood Sovereign"
    card_type: commander
    faction: Obsidion
    rarity: Legendary
    passive_ability:
      description: "Your creatures have Lifesteal"
      effect:
        type: grant_keyword
        keyword: Lifesteal
    flavor: "Blood is such an inefficient fuel. Let me show you how to refine it."

  - id: 5009
    name: "Shadow Emperor Kael"
    card_type: commander
    faction: Obsidion
    rarity: Legendary
    triggered_ability:
      trigger: OnKill
      description: "When one of your creatures kills an enemy, deal 1 damage to the enemy commander"
      effects:
        - type: damage
          amount: 1
          target: EnemyCommander
    flavor: "You never see him twice. Once is enough."

  - id: 5010
    name: "The Shadow Weaver"
    card_type: commander
    faction: Obsidion
    rarity: Legendary
    passive_ability:
      description: "Your creatures have Stealth"
      effect:
        type: grant_keyword
        keyword: Stealth
    flavor: "Shadows don't lie. They simply don't tell the whole truth."

  - id: 5011
    name: "Void Archon"
    card_type: commander
    faction: Obsidion
    rarity: Legendary
    passive_ability:
      description: "Your creatures have Quick"
      effect:
        type: grant_keyword
        keyword: Quick
    flavor: "Time is just another resource to exploit."
