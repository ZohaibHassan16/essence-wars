# Symbiote Circles Commanders
# 4 commanders defining the aggressive, pack-focused faction
# ID range: 5004-5007

commanders:
  - id: 5004
    name: "The Broodmother"
    card_type: commander
    faction: Symbiote
    rarity: Legendary
    passive_ability:
      description: "Your creatures have Rush"
      effect:
        type: grant_keyword
        keyword: Rush
    flavor: "Where the alpha howls, the pack follows."

  - id: 5005
    name: "Plague Sovereign"
    card_type: commander
    faction: Symbiote
    rarity: Legendary
    triggered_ability:
      trigger: StartOfTurn
      description: "At the start of your turn, summon a 1/1 Sporeling with Fungal Rot"
      effects:
        - type: summon_token
          token:
            name: "Sporeling"
            attack: 1
            health: 1
            keywords: []
            abilities:
              - name: "Fungal Rot"
                essence_cost: 1
                targeting: TargetEnemyCreature
                effects:
                  - type: destroy_self
                  - type: debuff
                    attack: -1
                    health: -1
    flavor: "From death blooms the endless rot."

  - id: 5006
    name: "Alpha of the Hunt"
    card_type: commander
    faction: Symbiote
    rarity: Legendary
    triggered_ability:
      trigger: OnAttack
      description: "When a creature attacks, give all your creatures +1/+0"
      effects:
        - type: buff_stats
          attack: 1
          health: 0
    flavor: "The pack hunts as one. The Alpha strikes first."

  - id: 5007
    name: "The Eternal Grove"
    card_type: commander
    faction: Symbiote
    rarity: Legendary
    triggered_ability:
      trigger: StartOfTurn
      description: "At the start of your turn, give all your creatures +1/+1"
      effects:
        - type: buff_stats
          attack: 1
          health: 1
    flavor: "The forest remembers. The forest grows."
