# Symbiote Circles Commanders
# 4 commanders defining the aggressive, swarm-focused faction
# ID range: 5004-5007

commanders:
  - id: 5004
    name: "The Broodmother"
    card_type: commander
    faction: Symbiote
    rarity: Legendary
    triggered_ability:
      trigger: OnCreaturePlayed
      description: "When you play a creature, summon a 1/1 Broodling with Rush"
      effects:
        - type: summon_token
          token:
            name: "Broodling"
            attack: 1
            health: 1
            keywords: [Rush]
    flavor: "Where she commands, the swarm follows."

  - id: 5005
    name: "Plague Sovereign"
    card_type: commander
    faction: Symbiote
    rarity: Legendary
    triggered_ability:
      trigger: OnAllyDeath
      description: "When one of your creatures dies, deal 2 damage to the enemy commander"
      effects:
        - type: damage
          amount: 2
          target: EnemyCommander
    flavor: "Every death feeds the plague."

  - id: 5006
    name: "Alpha of the Hunt"
    card_type: commander
    faction: Symbiote
    rarity: Legendary
    triggered_ability:
      trigger: OnAttack
      description: "When a creature attacks, give all your creatures +1/+0"
      effects:
        - type: buff_stats
          attack: 1
          health: 0
    flavor: "The pack hunts as one. The Alpha strikes first."

  - id: 5007
    name: "The Eternal Grove"
    card_type: commander
    faction: Symbiote
    rarity: Legendary
    triggered_ability:
      trigger: StartOfTurn
      description: "At the start of your turn, give all your creatures +1/+1"
      effects:
        - type: buff_stats
          attack: 1
          health: 1
    flavor: "The forest remembers. The forest grows."
