# Argentum Combine Commanders
# 4 commanders defining the defensive, construct-focused faction
# ID range: 5000-5003

commanders:
  - id: 5000
    name: "The High Artificer"
    card_type: commander
    faction: Argentum
    rarity: Legendary
    triggered_ability:
      trigger: StartOfTurn
      description: "At the start of your turn, summon a 2/2 Brass Cog"  # Buffed from 1/1→2/1→2/2 (v0.8.0 balance)
      effects:
        - type: summon_token
          token:
            name: "Brass Cog"
            attack: 2  # Buffed from 1 (v0.8.0 balance)
            health: 2  # Buffed from 1 (v0.8.0 balance wave 4)
            keywords: []
    flavor: "The Combine doesn't build soldiers. We manufacture victory."

  - id: 5001
    name: "The Sanctum Healer"
    card_type: commander
    faction: Argentum
    rarity: Legendary
    passive_ability:
      description: "Your creatures have +0/+3"
      effect:
        type: buff_stats
        attack: 0
        health: 3
    flavor: "Where gears mend flesh and essence restores steel."

  - id: 5002
    name: "Siege Marshal Vex"
    card_type: commander
    faction: Argentum
    rarity: Legendary
    passive_ability:
      description: "Your creatures have +2 Attack"  # Buffed from +1 (v0.8.0 balance wave 4)
      effect:
        type: buff_stats
        attack: 2  # Buffed from 1 (v0.8.0 balance wave 4)
        health: 0
    flavor: "A wall is just a door that hasn't been opened hard enough."

  - id: 5003
    name: "The Grand Architect"
    card_type: commander
    faction: Argentum
    rarity: Legendary
    passive_ability:
      description: "Your creatures have Fortify and +0/+2"
      effect:
        type: grant_keyword_and_buff
        keyword: Fortify
        attack: 0
        health: 2
    flavor: "Every bolt placed with purpose. Every gear turning in harmony."
