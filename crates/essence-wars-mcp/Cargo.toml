[package]
name = "essence-wars-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server for Essence Wars card game"

[[bin]]
name = "essence-wars-mcp"
path = "src/main.rs"

[dependencies]
# Internal crate
cardgame = { path = "../cardgame", features = ["parallel"] }

# ArrayVec for hand rendering
arrayvec = { version = "0.7", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full", "io-std"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency
parking_lot = "0.12"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Random number generation
rand.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# HTTP client for screenshot capture
ureq = "3"

# Base64 encoding for screenshot data
base64 = "0.22"
