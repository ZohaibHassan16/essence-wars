[package]
name = "cardgame"
version.workspace = true
edition.workspace = true
description = "High-performance card game engine for AI/RL research"
license = "MIT"
repository = "https://github.com/christianWissmann85/essence-wars"
keywords = ["game", "reinforcement-learning", "ai", "mcts", "gymnasium"]
categories = ["game-engines", "science"]
build = "build.rs"

[lib]
name = "cardgame"
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel"]
# Enable parallel execution via rayon (disable for WASM)
parallel = ["dep:rayon"]
# Python bindings for ML/AI research
python = ["dep:pyo3", "dep:numpy"]
# WASM bindings for web deployment (mutually exclusive with parallel)
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:console_error_panic_hook"]
# Web feature combines WASM with embedded data
web = ["wasm"]

[dependencies]
arrayvec.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
rand.workspace = true
clap.workspace = true
rayon = { workspace = true, optional = true }
chrono.workspace = true
statrs.workspace = true
lazy_static.workspace = true
flate2.workspace = true
indicatif.workspace = true
log = "0.4"
env_logger.workspace = true
ctrlc = "3.4"
num_cpus = "1.16"

# Optional Python bindings
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }

# Optional WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bin]]
name = "arena"
path = "src/bin/arena.rs"
required-features = ["parallel"]

[[bin]]
name = "tune"
path = "src/bin/tune.rs"
required-features = ["parallel"]

[[bin]]
name = "profile_mcts"
path = "src/bin/profile_mcts.rs"
required-features = ["parallel"]

[[bin]]
name = "validate"
path = "src/bin/validate.rs"
required-features = ["parallel"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["parallel"]

[[bin]]
name = "diagnose"
path = "src/bin/diagnose.rs"
required-features = ["parallel"]

[[bin]]
name = "generate_dataset"
path = "src/bin/generate_dataset.rs"
required-features = ["parallel"]

[[bin]]
name = "swiss"
path = "src/bin/swiss.rs"
required-features = ["parallel"]

[[bench]]
name = "game_benchmarks"
harness = false
