[package]
name = "cardgame"
version.workspace = true
edition.workspace = true
description = "High-performance card game engine for AI/RL research"
license = "MIT"
repository = "https://github.com/christianWissmann85/essence-wars"
keywords = ["game", "reinforcement-learning", "ai", "mcts", "gymnasium"]
categories = ["game-engines", "science"]
build = "build.rs"

[lib]
name = "cardgame"
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel", "cli"]
# Enable parallel execution via rayon
parallel = ["dep:rayon"]
# Python bindings for ML/AI research
python = ["dep:pyo3", "dep:numpy"]
# CLI tools support
cli = ["dep:ctrlc", "dep:indicatif", "dep:clap", "dep:env_logger", "dep:num_cpus"]

[dependencies]
arrayvec.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
rand.workspace = true
rayon = { workspace = true, optional = true }
chrono.workspace = true
statrs.workspace = true
lazy_static.workspace = true
flate2.workspace = true
log = "0.4"

# Optional CLI dependencies (not available for WASM)
indicatif = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
ctrlc = { version = "3.4", optional = true }
num_cpus = { version = "1.16", optional = true }

# Optional Python bindings
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bin]]
name = "arena"
path = "src/bin/arena.rs"
required-features = ["parallel"]

[[bin]]
name = "tune"
path = "src/bin/tune.rs"
required-features = ["parallel"]

[[bin]]
name = "profile_mcts"
path = "src/bin/profile_mcts.rs"
required-features = ["parallel"]

[[bin]]
name = "validate"
path = "src/bin/validate.rs"
required-features = ["parallel"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["parallel"]

[[bin]]
name = "diagnose"
path = "src/bin/diagnose.rs"
required-features = ["parallel"]

[[bin]]
name = "generate_dataset"
path = "src/bin/generate_dataset.rs"
required-features = ["parallel"]

[[bin]]
name = "swiss"
path = "src/bin/swiss.rs"
required-features = ["parallel"]

[[bench]]
name = "game_benchmarks"
harness = false
