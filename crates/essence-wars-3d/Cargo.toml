[package]
name = "essence-wars-3d"
version.workspace = true
edition.workspace = true
description = "3D Bevy client for Essence Wars card game"

[dependencies]
cardgame.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# Bevy with audio disabled (avoids alsa-sys dependency on Linux)
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "x11",
    "wayland",
] }
bevy_egui = "0.31"

[features]
default = []
dev = ["bevy/dynamic_linking"]
