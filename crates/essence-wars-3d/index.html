<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Essence Wars - A deterministic card game with Glassbox AI visualization">
    <title>Essence Wars - Glassbox Mode</title>

    <!-- Trunk will inject the WASM and JS here -->
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="../../assets" />

    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-title {
            font-family: 'Georgia', serif;
            font-size: 3rem;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 0.3em;
        }

        .loading-subtitle {
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(233, 69, 96, 0.2);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-progress {
            margin-top: 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #666;
        }

        /* Bevy canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Error display */
        #error {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2a2a3e;
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 2rem;
            max-width: 500px;
            text-align: center;
            z-index: 2000;
        }

        #error h2 {
            color: #e94560;
            margin-bottom: 1rem;
        }

        #error p {
            color: #ccc;
            line-height: 1.6;
        }

        #error code {
            display: block;
            background: #1a1a2e;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #ff6b6b;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <!-- Loading screen shown while WASM loads -->
    <div id="loading">
        <h1 class="loading-title">ESSENCE WARS</h1>
        <p class="loading-subtitle">GLASSBOX AI MODE</p>
        <div class="loading-spinner"></div>
        <p class="loading-progress">Loading game engine...</p>
    </div>

    <!-- Error display for WebGL/WASM issues -->
    <div id="error">
        <h2>Unable to Start</h2>
        <p>Essence Wars requires WebGL2 and WebAssembly support.</p>
        <p>Please try using a modern browser like Chrome, Firefox, or Edge.</p>
        <code id="error-details"></code>
    </div>

    <script>
        // Catch any unhandled errors during WASM initialization
        window.addEventListener('error', function(event) {
            console.error('[Essence Wars] Global error:', event.message, event.filename, event.lineno);
            document.querySelector('.loading-progress').textContent = 'Error: ' + event.message;
        });

        window.addEventListener('unhandledrejection', function(event) {
            console.error('[Essence Wars] Unhandled promise rejection:', event.reason);
            document.querySelector('.loading-progress').textContent = 'Error: ' + event.reason;
        });

        // Listen for WASM module events and call main()
        window.addEventListener('TrunkApplicationStarted', function(event) {
            console.log('[Essence Wars] TrunkApplicationStarted event received!', event.detail);

            // The WASM exports main() but it's not being called automatically
            // Let's call it manually
            if (event.detail && event.detail.wasm && event.detail.wasm.main) {
                console.log('[Essence Wars] Calling wasm.main() manually...');
                try {
                    event.detail.wasm.main();
                    console.log('[Essence Wars] wasm.main() returned');
                } catch (e) {
                    console.error('[Essence Wars] Error calling main():', e);
                    document.querySelector('.loading-progress').textContent = 'Error: ' + e.message;
                }
            } else {
                console.error('[Essence Wars] No main() function found in WASM exports!');
            }
        });

        console.log('[Essence Wars] Error handlers installed');

        // Check for required browser features
        function checkBrowserSupport() {
            const issues = [];

            // Check WebGL2
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl2');
            if (!gl) {
                issues.push('WebGL2 not supported');
            }

            // Check WebAssembly
            if (typeof WebAssembly !== 'object') {
                issues.push('WebAssembly not supported');
            }

            return issues;
        }

        const issues = checkBrowserSupport();
        if (issues.length > 0) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-details').textContent = issues.join(', ');
        } else {
            console.log('[Essence Wars] Browser support OK, waiting for WASM...');
        }

        // Hide loading screen when Bevy starts rendering
        // Bevy will call this via wasm_bindgen
        window.hideLoadingScreen = function() {
            console.log('[Essence Wars] Hiding loading screen');
            const loading = document.getElementById('loading');
            if (loading) {
                loading.classList.add('hidden');
                setTimeout(() => loading.remove(), 500);
            }
        };

        // Update loading progress text
        window.updateLoadingProgress = function(text) {
            console.log('[Essence Wars] Progress:', text);
            const progress = document.querySelector('.loading-progress');
            if (progress) {
                progress.textContent = text;
            }
        };

        // Log when WASM module loads
        window.addEventListener('load', () => {
            console.log('[Essence Wars] Page loaded, WASM should initialize...');
        });
    </script>
</body>
</html>
