[package]
name = "essence-wars-ui"
version.workspace = true
edition.workspace = true
description = "Essence Wars Desktop Client"
authors = ["Christian Wissmann"]
license.workspace = true

[lib]
name = "essence_wars_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Game engine
cardgame.workspace = true

# Async
tokio = { version = "1", features = ["sync", "rt-multi-thread", "net"] }

# HTTP server for MCP sync
axum = "0.8"

# Error handling
anyhow = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
rand = "0.8"
dirs = "5.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
