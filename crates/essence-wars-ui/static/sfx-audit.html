<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essence Wars - SFX Audit Tool</title>
  <style>
    :root {
      --bg-dark: #1a1a2e;
      --bg-card: #16213e;
      --bg-hover: #1f3460;
      --accent-gold: #d4af37;
      --accent-green: #7fff00;
      --accent-red: #ff4444;
      --text-primary: #f5f5f5;
      --text-secondary: #aaa;
      --argentum: #d4af37;
      --symbiote: #7fff00;
      --obsidion: #00ffff;
      --neutral: #b87333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: var(--accent-gold);
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    button {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 2px solid var(--accent-gold);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--accent-gold);
      color: var(--bg-dark);
    }

    button.danger {
      border-color: var(--accent-red);
    }

    button.danger:hover {
      background: var(--accent-red);
    }

    .stats {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      background: var(--bg-card);
      border-radius: 8px;
    }

    .stats span {
      margin: 0 15px;
    }

    .keep-count { color: var(--accent-green); }
    .replace-count { color: var(--accent-red); }
    .pending-count { color: var(--text-secondary); }

    .category {
      margin-bottom: 30px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding: 10px 15px;
      background: var(--bg-card);
      border-radius: 8px;
      cursor: pointer;
    }

    .category-header:hover {
      background: var(--bg-hover);
    }

    .category-header h2 {
      flex: 1;
      font-size: 1.2rem;
    }

    .category-header.argentum { border-left: 4px solid var(--argentum); }
    .category-header.symbiote { border-left: 4px solid var(--symbiote); }
    .category-header.obsidion { border-left: 4px solid var(--obsidion); }
    .category-header.neutral { border-left: 4px solid var(--neutral); }
    .category-header.ui { border-left: 4px solid var(--accent-gold); }
    .category-header.combat { border-left: 4px solid #ff6b6b; }

    .category-badge {
      background: var(--bg-dark);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    .sound-list {
      display: grid;
      gap: 10px;
    }

    .sound-item {
      display: grid;
      grid-template-columns: 40px 1fr 200px 120px;
      align-items: center;
      gap: 15px;
      padding: 12px 15px;
      background: var(--bg-card);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .sound-item:hover {
      background: var(--bg-hover);
    }

    .sound-item.keep {
      border-left: 4px solid var(--accent-green);
    }

    .sound-item.replace {
      border-left: 4px solid var(--accent-red);
    }

    .sound-index {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-align: center;
    }

    .sound-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sound-name {
      font-weight: 600;
    }

    .sound-path {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-family: monospace;
    }

    .sound-usage {
      font-size: 0.75rem;
      color: var(--accent-gold);
    }

    audio {
      width: 100%;
      height: 32px;
    }

    .vote-buttons {
      display: flex;
      gap: 8px;
    }

    .vote-btn {
      width: 50px;
      height: 36px;
      border: 2px solid;
      border-radius: 6px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }

    .vote-btn.keep-btn {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .vote-btn.keep-btn:hover, .vote-btn.keep-btn.active {
      background: var(--accent-green);
      color: var(--bg-dark);
    }

    .vote-btn.replace-btn {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .vote-btn.replace-btn:hover, .vote-btn.replace-btn.active {
      background: var(--accent-red);
      color: var(--bg-dark);
    }

    .notes-input {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: var(--bg-dark);
      border: 1px solid var(--text-secondary);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 0.85rem;
      resize: none;
    }

    .notes-input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .export-preview {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-card);
      padding: 30px;
      border-radius: 12px;
      max-width: 800px;
      max-height: 80vh;
      overflow: auto;
      z-index: 1000;
      border: 2px solid var(--accent-gold);
    }

    .export-preview.show {
      display: block;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
    }

    .overlay.show {
      display: block;
    }

    pre {
      background: var(--bg-dark);
      padding: 15px;
      border-radius: 8px;
      overflow: auto;
      font-size: 0.85rem;
      max-height: 400px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    @media (max-width: 800px) {
      .sound-item {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <h1>Essence Wars - SFX Audit Tool</h1>
  <p class="subtitle">Listen to battle sounds and mark them for keeping or replacement</p>

  <div class="controls">
    <button onclick="playAll()">Play All Sequentially</button>
    <button onclick="stopAll()">Stop All</button>
    <button onclick="markAllKeep()">Mark All Keep</button>
    <button onclick="markAllReplace()" class="danger">Mark All Replace</button>
    <button onclick="resetAll()" class="danger">Reset All</button>
    <button onclick="exportResults()">Export Results</button>
  </div>

  <div class="stats">
    <span class="keep-count">Keep: <strong id="keepCount">0</strong></span>
    <span class="replace-count">Replace: <strong id="replaceCount">0</strong></span>
    <span class="pending-count">Pending: <strong id="pendingCount">0</strong></span>
  </div>

  <div id="soundCategories"></div>

  <div class="overlay" id="overlay" onclick="closeModal()"></div>
  <div class="export-preview" id="exportModal">
    <h2>Export Results</h2>
    <pre id="exportContent"></pre>
    <div class="modal-buttons">
      <button onclick="downloadJSON()">Download JSON</button>
      <button onclick="copyToClipboard()">Copy to Clipboard</button>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    // Sound data organized by category
    const soundData = {

      },

        sounds: [
          { path: "/sounds/rpg/blade_01.ogg", name: "Blade 01", usage: "attackLight (neutral)" },
          { path: "/sounds/rpg/blade_02.ogg", name: "Blade 02", usage: "attackMedium (neutral)" },
          { path: "/sounds/rpg/blade_03.ogg", name: "Blade 03", usage: "attackHeavy (neutral)" },
          { path: "/sounds/rpg/spell_01.ogg", name: "Spell 01", usage: "cardPlaySpell, abilityActivate" },
          { path: "/sounds/rpg/spell_02.ogg", name: "Spell 02", usage: "cardPlaySpell, abilityActivate" },
          { path: "/sounds/rpg/creature_die_01.ogg", name: "Creature Die 01", usage: "creatureDeath (neutral)" },
          { path: "/sounds/rpg/item_gem_01.ogg", name: "Item Gem 01", usage: "heal" },
          { path: "/sounds/rpg/item_gem_02.ogg", name: "Item Gem 02", usage: "heal" },

        ]

        sounds: [
          { path: "/sounds/creatures/hurt_01.ogg", name: "Hurt 01", usage: "damage" },
          { path: "/sounds/creatures/hurt_02.ogg", name: "Hurt 02", usage: "damage" },
          { path: "/sounds/creatures/hurt_03.ogg", name: "Hurt 03", usage: "damage" },
          { path: "/sounds/creatures/hurt_04.ogg", name: "Hurt 04", usage: "damage" },
          { path: "/sounds/creatures/hurt_05.ogg", name: "Hurt 05", usage: "damage, neutral death" },
        ]

      "Argentum (Metal/Mechanical)": {

        sounds: [

          { path: "/sounds/rpg/chain_01.ogg", name: "Chain 01", usage: "attack medium" },
          { path: "/sounds/rpg/chain_02.ogg", name: "Chain 02", usage: "attack heavy" },
          { path: "/sounds/rpg/chain_03.ogg", name: "Chain 03", usage: "attack heavy" },
          { path: "/sounds/rpg/lock_01.ogg", name: "Lock 01", usage: "summon" },
          { path: "/sounds/rpg/lock_02.ogg", name: "Lock 02", usage: "summon" },
          { path: "/sounds/rpg/stones_01.ogg", name: "Stones 01", usage: "summon" },
          { path: "/sounds/rpg/stones_02.ogg", name: "Stones 02", usage: "summon" },
          { path: "/sounds/rpg/stones_03.ogg", name: "Stones 03", usage: "death" },
          { path: "/sounds/rpg/stones_04.ogg", name: "Stones 04", usage: "death" },
        ]
      },
      "Symbiote (Organic/Alien)": {
        class: "symbiote",
        sounds: [
          { path: "/sounds/creatures/spit_01.ogg", name: "Spit 01", usage: "attack light" },
          { path: "/sounds/creatures/spit_02.ogg", name: "Spit 02", usage: "attack light" },
          { path: "/sounds/rpg/creature_slime_01.ogg", name: "Slime 01", usage: "attack medium" },
          { path: "/sounds/rpg/creature_slime_02.ogg", name: "Slime 02", usage: "attack medium" },
          { path: "/sounds/rpg/creature_slime_03.ogg", name: "Slime 03", usage: "attack heavy" },
          { path: "/sounds/rpg/creature_slime_04.ogg", name: "Slime 04", usage: "attack heavy" },
          { path: "/sounds/creatures/burble_01.ogg", name: "Burble 01", usage: "summon" },
          { path: "/sounds/creatures/burble_02.ogg", name: "Burble 02", usage: "summon" },
          { path: "/sounds/creatures/bug_01.ogg", name: "Bug 01", usage: "summon" },
          { path: "/sounds/creatures/bug_02.ogg", name: "Bug 02", usage: "summon" },
          { path: "/sounds/creatures/alien_01.ogg", name: "Alien 01", usage: "death" },
          { path: "/sounds/creatures/alien_02.ogg", name: "Alien 02", usage: "death" },
          { path: "/sounds/creatures/weird_01.ogg", name: "Weird 01", usage: "death" },
          { path: "/sounds/creatures/weird_02.ogg", name: "Weird 02", usage: "death" },
        ]
      },
      "Obsidion (Dark/Fire)": {
        class: "obsidion",
        sounds: [
          { path: "/sounds/rpg/spell_fire_01.ogg", name: "Spell Fire 01", usage: "attack light" },
          { path: "/sounds/rpg/spell_fire_02.ogg", name: "Spell Fire 02", usage: "attack light" },
          { path: "/sounds/rpg/spell_fire_03.ogg", name: "Spell Fire 03", usage: "attack medium" },
          { path: "/sounds/rpg/spell_fire_04.ogg", name: "Spell Fire 04", usage: "attack medium" },
          { path: "/sounds/rpg/spell_fire_05.ogg", name: "Spell Fire 05", usage: "attack heavy" },
          { path: "/sounds/rpg/spell_fire_06.ogg", name: "Spell Fire 06", usage: "attack heavy" },
          { path: "/sounds/rpg/spell_fire_07.ogg", name: "Spell Fire 07", usage: "attack heavy" },
          { path: "/sounds/rpg/creature_roar_01.ogg", name: "Creature Roar 01", usage: "summon" },
          { path: "/sounds/rpg/creature_roar_02.ogg", name: "Creature Roar 02", usage: "summon" },
          { path: "/sounds/rpg/creature_roar_03.ogg", name: "Creature Roar 03", usage: "summon" },
          { path: "/sounds/creatures/scream_01.ogg", name: "Scream 01", usage: "death" },
          { path: "/sounds/creatures/scream_02.ogg", name: "Scream 02", usage: "death" },
          { path: "/sounds/creatures/monster_01.ogg", name: "Monster 01", usage: "death" },
        ]
      },
      "Victory/Defeat Stings": {
        class: "ui",
        sounds: [
          { path: "/music/victory.ogg", name: "Victory Sting", usage: "victory" },
          { path: "/music/defeat.ogg", name: "Defeat Sting", usage: "defeat" },
        ]
      }
    };

    // State for each sound
    const soundStates = {};
    let currentAudio = null;
    let playQueue = [];
    let playIndex = 0;

    function init() {
      const container = document.getElementById('soundCategories');
      let globalIndex = 0;

      for (const [categoryName, category] of Object.entries(soundData)) {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'category';

        const header = document.createElement('div');
        header.className = `category-header ${category.class}`;
        header.innerHTML = `
          <h2>${categoryName}</h2>
          <span class="category-badge">${category.sounds.length} sounds</span>
        `;
        categoryDiv.appendChild(header);

        const soundList = document.createElement('div');
        soundList.className = 'sound-list';

        for (const sound of category.sounds) {
          const id = sound.path.replace(/[^a-zA-Z0-9]/g, '_');
          soundStates[id] = { path: sound.path, status: 'pending', notes: '' };

          const item = document.createElement('div');
          item.className = 'sound-item';
          item.id = `item-${id}`;
          item.innerHTML = `
            <div class="sound-index">#${++globalIndex}</div>
            <div class="sound-info">
              <div class="sound-name">${sound.name}</div>
              <div class="sound-path">${sound.path}</div>
              <div class="sound-usage">Used for: ${sound.usage}</div>
              <textarea class="notes-input" placeholder="Notes (optional)..."
                        onchange="updateNotes('${id}', this.value)"
                        rows="1"></textarea>
            </div>
            <audio controls src="${sound.path}" preload="none"></audio>
            <div class="vote-buttons">
              <button class="vote-btn keep-btn" onclick="vote('${id}', 'keep')" title="Keep">&#x2714;</button>
              <button class="vote-btn replace-btn" onclick="vote('${id}', 'replace')" title="Replace">&#x2718;</button>
            </div>
          `;
          soundList.appendChild(item);
        }

        categoryDiv.appendChild(soundList);
        container.appendChild(categoryDiv);
      }

      updateStats();
      loadState();
    }

    function vote(id, status) {
      soundStates[id].status = status;
      const item = document.getElementById(`item-${id}`);
      item.classList.remove('keep', 'replace');
      item.classList.add(status);

      const keepBtn = item.querySelector('.keep-btn');
      const replaceBtn = item.querySelector('.replace-btn');
      keepBtn.classList.toggle('active', status === 'keep');
      replaceBtn.classList.toggle('active', status === 'replace');

      updateStats();
      saveState();
    }

    function updateNotes(id, notes) {
      soundStates[id].notes = notes;
      saveState();
    }

    function updateStats() {
      let keep = 0, replace = 0, pending = 0;
      for (const state of Object.values(soundStates)) {
        if (state.status === 'keep') keep++;
        else if (state.status === 'replace') replace++;
        else pending++;
      }
      document.getElementById('keepCount').textContent = keep;
      document.getElementById('replaceCount').textContent = replace;
      document.getElementById('pendingCount').textContent = pending;
    }

    function markAllKeep() {
      for (const id of Object.keys(soundStates)) {
        vote(id, 'keep');
      }
    }

    function markAllReplace() {
      for (const id of Object.keys(soundStates)) {
        vote(id, 'replace');
      }
    }

    function resetAll() {
      if (!confirm('Reset all votes and notes?')) return;
      for (const id of Object.keys(soundStates)) {
        soundStates[id].status = 'pending';
        soundStates[id].notes = '';
        const item = document.getElementById(`item-${id}`);
        item.classList.remove('keep', 'replace');
        item.querySelector('.keep-btn').classList.remove('active');
        item.querySelector('.replace-btn').classList.remove('active');
        item.querySelector('.notes-input').value = '';
      }
      updateStats();
      localStorage.removeItem('sfxAuditState');
    }

    function playAll() {
      playQueue = document.querySelectorAll('audio');
      playIndex = 0;
      playNext();
    }

    function playNext() {
      if (playIndex >= playQueue.length) return;
      stopAll();
      currentAudio = playQueue[playIndex];
      currentAudio.play();
      currentAudio.onended = () => {
        playIndex++;
        playNext();
      };
    }

    function stopAll() {
      document.querySelectorAll('audio').forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
    }

    function exportResults() {
      const results = {
        exportDate: new Date().toISOString(),
        summary: {
          keep: Object.values(soundStates).filter(s => s.status === 'keep').length,
          replace: Object.values(soundStates).filter(s => s.status === 'replace').length,
          pending: Object.values(soundStates).filter(s => s.status === 'pending').length,
        },
        toReplace: [],
        toKeep: [],
        pending: [],
        searchGuidance: {
          description: "Looking for cohesive battle SFX for a medieval/Renaissance card game with distinct factions",
          factions: {
            argentum: "Mechanical/metallic - constructs, clockwork, steam",
            symbiote: "Organic/alien - slime, insects, mutations",
            obsidion: "Dark magic/fire - demons, shadows, flames"
          },
          soundTypes: [
            "Attack sounds (light/medium/heavy per faction)",
            "Creature summon sounds (faction-specific)",
            "Creature death sounds (faction-specific)",
            "Damage/hurt sounds (generic)",
            "Spell casting sounds",
            "Heal sounds"
          ]
        }
      };

      for (const [id, state] of Object.entries(soundStates)) {
        const entry = { path: state.path };
        if (state.notes) entry.notes = state.notes;

        if (state.status === 'replace') {
          results.toReplace.push(entry);
        } else if (state.status === 'keep') {
          results.toKeep.push(entry);
        } else {
          results.pending.push(entry);
        }
      }

      document.getElementById('exportContent').textContent = JSON.stringify(results, null, 2);
      document.getElementById('overlay').classList.add('show');
      document.getElementById('exportModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('exportModal').classList.remove('show');
    }

    function downloadJSON() {
      const content = document.getElementById('exportContent').textContent;
      const blob = new Blob([content], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sfx-audit-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyToClipboard() {
      const content = document.getElementById('exportContent').textContent;
      navigator.clipboard.writeText(content).then(() => {
        alert('Copied to clipboard!');
      });
    }

    function saveState() {
      localStorage.setItem('sfxAuditState', JSON.stringify(soundStates));
    }

    function loadState() {
      const saved = localStorage.getItem('sfxAuditState');
      if (saved) {
        const loaded = JSON.parse(saved);
        for (const [id, state] of Object.entries(loaded)) {
          if (soundStates[id]) {
            soundStates[id] = state;
            if (state.status !== 'pending') {
              vote(id, state.status);
            }
            if (state.notes) {
              const item = document.getElementById(`item-${id}`);
              if (item) {
                item.querySelector('.notes-input').value = state.notes;
              }
            }
          }
        }
      }
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
