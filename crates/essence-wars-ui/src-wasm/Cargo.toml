[package]
name = "essence-wars-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for Essence Wars game engine"
authors = ["Christian Wissmann"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
# Core game engine (with wasm features, no parallel)
cardgame = { path = "../../cardgame", default-features = false, features = ["wasm"] }

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = { version = "0.1", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# Random number generation (WASM-compatible)
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for size in release builds
opt-level = "s"
lto = true
