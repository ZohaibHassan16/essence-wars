[package]
name = "cardgame"
version = "0.5.0"
edition = "2021"

[dependencies]
arrayvec = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
clap = { version = "4.4", features = ["derive"] }
rayon = "1.10"
chrono = "0.4"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[[bin]]
name = "tune"
path = "src/bin/tune.rs"

[[bin]]
name = "profile_mcts"
path = "src/bin/profile_mcts.rs"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"

[[bench]]
name = "game_benchmarks"
harness = false
