[package]
name = "cardgame"
version = "0.3.0"
edition = "2021"

[dependencies]
arrayvec = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
clap = { version = "4.4", features = ["derive"] }
rayon = "1.10"
chrono = "0.4"

# TUI framework
ratatui = "0.28"
crossterm = "0.28"
tui-input = "0.10"
unicode-width = "0.2"
dirs = "5.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
serde_json = "1.0"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[[bin]]
name = "tune"
path = "src/bin/tune.rs"

[[bin]]
name = "profile_mcts"
path = "src/bin/profile_mcts.rs"

[[bin]]
name = "lab"
path = "src/bin/lab.rs"

[[bench]]
name = "game_benchmarks"
harness = false
