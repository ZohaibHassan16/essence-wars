# Evaluate a submitted agent and update the leaderboard
#
# Triggered by:
#   - Issue labeled with 'evaluate-agent'
#   - Manual workflow dispatch
#
# The issue body should contain:
#   Model URL: https://huggingface.co/username/model-name
#   or
#   Checkpoint: path/to/local/checkpoint.pt

name: Evaluate Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      model_url:
        description: 'HuggingFace model URL or local checkpoint path'
        required: true
      agent_name:
        description: 'Display name for the agent'
        required: true
      full_eval:
        description: 'Run full evaluation (400 games)'
        type: boolean
        default: true

jobs:
  evaluate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'evaluate-agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install huggingface_hub

      - name: Parse issue for model info
        if: github.event_name == 'issues'
        id: parse_issue
        run: |
          # Extract model URL from issue body
          BODY="${{ github.event.issue.body }}"
          MODEL_URL=$(echo "$BODY" | grep -oP 'https://huggingface\.co/[^\s]+' | head -1)
          AGENT_NAME=$(echo "$BODY" | grep -oP 'Name:\s*\K[^\n]+' | head -1)

          if [ -z "$MODEL_URL" ]; then
            echo "ERROR: No HuggingFace URL found in issue body"
            exit 1
          fi

          echo "model_url=$MODEL_URL" >> $GITHUB_OUTPUT
          echo "agent_name=${AGENT_NAME:-Submitted Agent}" >> $GITHUB_OUTPUT

      - name: Set model info from dispatch
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_info
        run: |
          echo "model_url=${{ inputs.model_url }}" >> $GITHUB_OUTPUT
          echo "agent_name=${{ inputs.agent_name }}" >> $GITHUB_OUTPUT

      - name: Download model from HuggingFace
        id: download
        run: |
          MODEL_URL="${{ steps.parse_issue.outputs.model_url || steps.dispatch_info.outputs.model_url }}"

          # Extract repo_id from URL
          REPO_ID=$(echo "$MODEL_URL" | sed 's|https://huggingface.co/||')

          echo "Downloading from: $REPO_ID"

          python -c "
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(repo_id='$REPO_ID', filename='model.pt')
          print(f'checkpoint_path={path}')
          " >> $GITHUB_OUTPUT

      - name: Run benchmark evaluation
        id: benchmark
        run: |
          CHECKPOINT="${{ steps.download.outputs.checkpoint_path }}"
          FULL_EVAL="${{ inputs.full_eval || 'true' }}"

          if [ "$FULL_EVAL" = "true" ]; then
            EVAL_FLAG="--full-eval"
          else
            EVAL_FLAG=""
          fi

          uv run python python/scripts/run_benchmark.py \
            --checkpoint "$CHECKPOINT" \
            --output results.json \
            $EVAL_FLAG

          # Extract results for summary
          WIN_RATE=$(jq -r '.win_rate_vs_greedy' results.json)
          ELO=$(jq -r '.elo_rating' results.json)

          echo "win_rate=$WIN_RATE" >> $GITHUB_OUTPUT
          echo "elo=$ELO" >> $GITHUB_OUTPUT

      - name: Update leaderboard
        run: |
          AGENT_NAME="${{ steps.parse_issue.outputs.agent_name || steps.dispatch_info.outputs.agent_name }}"
          MODEL_URL="${{ steps.parse_issue.outputs.model_url || steps.dispatch_info.outputs.model_url }}"
          REPO_ID=$(echo "$MODEL_URL" | sed 's|https://huggingface.co/||')

          # Add to leaderboard (using results.json)
          uv run python -c "
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          # Load results
          with open('results.json') as f:
              metrics = json.load(f)

          # Load leaderboard
          lb_path = Path('data/leaderboard/leaderboard.json')
          with open(lb_path) as f:
              data = json.load(f)

          # Create entry
          entry = {
              'id': '$REPO_ID',
              'name': '$AGENT_NAME',
              'author': '$REPO_ID'.split('/')[0],
              'model_type': 'ppo',
              'description': 'Community submission via GitHub Actions',
              'elo_rating': metrics.get('elo_rating', 1200),
              'confidence_interval': 35,
              'total_games': metrics.get('games_played', 400),
              'metrics': {
                  'win_rate_vs_random': metrics.get('win_rate_vs_random'),
                  'win_rate_vs_greedy': metrics.get('win_rate_vs_greedy'),
                  'win_rate_vs_mcts50': metrics.get('win_rate_vs_mcts50'),
                  'win_rate_vs_mcts100': metrics.get('win_rate_vs_mcts100'),
              },
              'submission': {
                  'date': datetime.now(timezone.utc).isoformat(),
                  'source': 'github-actions',
                  'model_url': '$MODEL_URL',
                  'run_id': '${{ github.run_id }}',
              },
              'tags': ['community'],
              'is_baseline': False,
          }

          # Remove existing entry if present
          data['agents'] = [a for a in data['agents'] if a['id'] != '$REPO_ID']
          data['agents'].append(entry)
          data['metadata']['last_updated'] = datetime.now(timezone.utc).isoformat()

          with open(lb_path, 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Regenerate leaderboard markdown
        run: |
          uv run python python/scripts/generate_leaderboard.py
          uv run python python/scripts/generate_leaderboard.py --format html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard/leaderboard.json docs/leaderboard.md docs/leaderboard.html
          git commit -m "Update leaderboard: ${{ steps.parse_issue.outputs.agent_name || steps.dispatch_info.outputs.agent_name }}"
          git push

      - name: Comment on issue with results
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const winRate = '${{ steps.benchmark.outputs.win_rate }}';
            const elo = '${{ steps.benchmark.outputs.elo }}';
            const agentName = '${{ steps.parse_issue.outputs.agent_name }}';

            const body = `## Evaluation Complete! 🎉

            **Agent**: ${agentName}
            **Elo Rating**: ${elo}
            **Win Rate vs Greedy**: ${(parseFloat(winRate) * 100).toFixed(1)}%

            Your agent has been added to the [leaderboard](../docs/leaderboard.md).

            ---
            *Evaluated by GitHub Actions (Run #${{ github.run_id }})*`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

            // Add 'evaluated' label and remove 'evaluate-agent'
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['evaluated']
            });

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results.json
