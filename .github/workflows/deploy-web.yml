# Deploy Web Demo to GitHub Pages
#
# This workflow builds and deploys the Essence Wars web demo
# to GitHub Pages at: https://christianwissmann85.github.io/essence-wars/
#
# Triggers:
# - Push to master (changes to game engine, UI, or data)
# - Manual workflow_dispatch
#
# The workflow:
# 1. Builds the WASM module from the Rust game engine
# 2. Builds the static SvelteKit site
# 3. Deploys to GitHub Pages

name: Deploy Web Demo

on:
  push:
    branches: [master]
    paths:
      - 'crates/cardgame/**'
      - 'crates/essence-wars-ui/**'
      - 'data/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/cardgame
            crates/essence-wars-ui/src-wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        run: |
          cd crates/essence-wars-ui/src-wasm
          wasm-pack build --target web --release
          echo "WASM build complete:"
          ls -lh pkg/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: crates/essence-wars-ui
        run: pnpm install

      - name: Build static site
        working-directory: crates/essence-wars-ui
        run: pnpm run build:web
        env:
          BASE_PATH: '/essence-wars'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/essence-wars-ui/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
