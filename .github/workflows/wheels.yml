# Build Python wheels for multiple platforms using maturin
# Can be triggered directly or called by publish.yml

name: Build Wheels

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:  # Allow this workflow to be called by other workflows

permissions:
  contents: read

jobs:
  # Build wheels for Linux x86_64 (native build)
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist -i 3.10 -i 3.11 -i 3.12 -i 3.13
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  # Build wheels for Linux aarch64 (cross-compile)
  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist -i 3.10 -i 3.11 -i 3.12 -i 3.13
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: dist

  # Build wheels for macOS (x86_64 and ARM64)
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}-apple-darwin
          args: --release --out dist
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # Build wheels for Windows (x86_64 only)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist

  # Build source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Test the built wheel in a clean environment (no data/ directory)
  # This catches issues where code uses filesystem paths instead of embedded data
  test-wheel:
    needs: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            python/scripts/utils/test_pypi_install.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Install wheel in clean environment
        run: |
          # Create a clean directory without the data/ folder
          mkdir -p /tmp/clean-test
          cd /tmp/clean-test
          python -m venv venv
          source venv/bin/activate
          # Install the wheel (should work without data/ directory)
          pip install $GITHUB_WORKSPACE/dist/*cp311*manylinux*.whl

      - name: Run smoke test
        run: |
          cd /tmp/clean-test
          source venv/bin/activate
          # Basic smoke test - if embedded data isn't working, this fails
          python -c "
          import essence_wars
          print(f'Version: {essence_wars.__version__}')
          decks = essence_wars.list_decks()
          print(f'Decks: {len(decks)}')
          assert len(decks) == 12, f'Expected 12 decks, got {len(decks)}'

          # Create and play a game
          game = essence_wars.PyGame()
          game.reset(seed=42)
          obs = game.observe()
          assert obs.shape == (328,), f'Bad obs shape: {obs.shape}'
          mask = game.action_mask()
          assert mask.shape == (256,), f'Bad mask shape: {mask.shape}'
          print('Smoke test PASSED!')
          "

      - name: Run full test script
        run: |
          cd /tmp/clean-test
          source venv/bin/activate
          python $GITHUB_WORKSPACE/python/scripts/utils/test_pypi_install.py
