name: Build Windows Release

on:
  push:
    branches: [master]
    paths:
      - 'crates/essence-wars-ui/**'
      - 'crates/cardgame/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: # Allows manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies (Windows)
        run: |
          # WebView2 is pre-installed on windows-latest runners
          echo "WebView2 already available"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: crates/essence-wars-ui
        run: pnpm install

      - name: Build frontend
        working-directory: crates/essence-wars-ui
        run: pnpm run build

      - name: Install Tauri CLI (cached)
        run: |
          cargo install tauri-cli --version ^2.0.0 --locked || echo "Using cached tauri-cli"

      - name: Build Tauri app (Windows)
        working-directory: crates/essence-wars-ui
        run: cargo tauri build

      - name: List build outputs (debug)
        run: |
          echo "Checking target directory..."
          dir target\release\
          if (Test-Path target\release\bundle) { dir target\release\bundle\ -Recurse }
        shell: pwsh

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: essence-wars-windows-installer
          path: target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: essence-wars-windows-exe
          path: target/release/essence-wars-ui.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Create release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
